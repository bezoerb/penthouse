name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.18.0, 24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: ${{ matrix.node-version }}
          cache: true

      - name: Cache Puppeteer Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: ${{ runner.os }}-puppeteer-${{ matrix.node-version }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-puppeteer-${{ matrix.node-version }}-
            ${{ runner.os }}-puppeteer-

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libxss1 \
            libatspi2.0-0 \
            libgtk-3-0 \
            graphicsmagick
          # Handle time_t transition packages
          sudo apt-get install -y libasound2 || sudo apt-get install -y libasound2t64

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Lint code
        run: vp lint src

      - name: Run tests
        run: vp test run --exclude 'test/run-sequential/**'

      - name: Run node-module tests
        run: vp test run test/run-sequential/node-module.test.js

      - name: Run performance tests
        run: vp test run test/run-sequential/perf.test.js
